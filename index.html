<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yeeps Channel</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      body { font-family: "Londrina Solid", "Trebuchet MS", sans-serif; color: #fff; }

      #player { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

      #overlay {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      }
      #overlay.hidden { display: none; }

      /* The WATCH badge is the button */
      #playBtn {
        width: min(72vw, 640px); padding: 0; border: 0; background: none; line-height: 0; cursor: pointer;
        transition: transform 0.12s ease;
      }
      #playBtn img { display: block; width: 100%; height: auto; }
      #playBtn:hover { transform: scale(1.03); }
      #playBtn:active { transform: scale(0.97); }
      #playBtn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }

      #status { min-height: 1.4em; padding: 0 16px; text-align: center; font-size: 24px; letter-spacing: 0.3px; }
      #debug {
        display: none; max-width: 92%; padding: 0 12px; text-align: center; word-break: break-all;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; opacity: 0.55;
      }
      #debug.show { display: block; }
    </style>
  </head>
  <body>
    <video id="player" playsinline></video>
    <div id="overlay">
      <button id="playBtn" aria-label="Watch Yeeps Channel"><img src="./watch-logo.svg" alt="" /></button>
      <div id="status">Loading…</div>
      <div id="debug"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
